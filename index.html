<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iu iu Soạn đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/openchemlib@8.17.0/dist/openchemlib-minimal.js"></script>
<style>
/* Bố cục: thanh đỏ sẫm trên cùng · trái là ô nội dung · phải là trang A4 xem trước */
:root{
  --wine:#8a1c2b; --wine-deep:#5f0f1c; --wine-soft:#fbeaec;
  --ink:#1d1a1f; --muted:#6c6570; --line:#ece6ea; --paper:#ffffff; --ground:#f7f4f6;
  --blue:#0000ff; --navy:#002060; --gold:#ffd84d; --ok:#1f9d63; --warn:#d97706;
  --ui:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --doc:"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--ground);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr}
/* Thanh trên */
.top{background:linear-gradient(100deg,var(--wine-deep),var(--wine) 55%,#a8283a);color:#fff;
  display:flex;align-items:center;gap:16px;padding:12px max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 6px 24px -12px rgba(95,15,28,.6);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);
  transform:translateX(-100%);animation:sheen 6s ease-in-out 1s infinite}
@keyframes sheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(255,216,77,.85),0 6px 16px -6px rgba(0,0,0,.5);animation:avin .7s cubic-bezier(.2,.9,.3,1.3) both}
.avatar:hover{transform:rotate(-6deg) scale(1.06);transition:transform .25s}
@keyframes avin{from{opacity:0;transform:scale(.4) rotate(-25deg)}}
.logo polygon{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.4s .2s ease-out forwards}
.logo circle{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1s 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:12px;opacity:.82;font-weight:500}
.top .spacer{flex:1}
.ver{font-size:12px;font-weight:600;background:rgba(255,255,255,.16);padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.btn{font-family:var(--ui);font-weight:600;font-size:14px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.btn-main{background:#fff;color:var(--wine);box-shadow:0 6px 18px -8px rgba(0,0,0,.45)}
.btn-main:hover{box-shadow:0 10px 26px -8px rgba(0,0,0,.5);transform:translateY(-1px)}
.btn-soft{background:var(--wine-soft);color:var(--wine)}
.btn-soft:hover{background:#f6d9dd}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .6s ease-out;background:rgba(138,28,43,.25);pointer-events:none}
.btn-ghost .ripple{background:rgba(255,255,255,.4)}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* Thân */
.main{display:grid;grid-template-columns:minmax(330px,40%) 1fr;gap:18px;padding:18px max(18px,env(safe-area-inset-left,0px));min-height:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;min-width:0;
  box-shadow:0 18px 40px -30px rgba(95,15,28,.35);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.panel:nth-child(2){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--wine)}
.ph .spacer{flex:1}
textarea{flex:1;border:0;resize:none;padding:14px 16px;font:14.5px/1.7 var(--ui);color:var(--ink);outline:none;min-height:0;background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--ground);color:var(--muted);display:inline-flex;gap:6px;align-items:center;transition:background .3s,color .3s}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.warn{background:#fff4e0;color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.12)}}
/* Xem trước */
.stage{flex:1;overflow:auto;background:repeating-linear-gradient(45deg,#f3eef1 0 12px,#f6f2f4 12px 24px);padding:24px;min-height:0}
.zoomwrap{transform-origin:top center;margin:0 auto;width:21cm}
.page{width:21cm;min-height:29.7cm;background:#fff;margin:0 auto;padding:.75cm 1.5cm 1.5cm 1cm;box-shadow:0 2px 3px rgba(0,0,0,.08),0 24px 50px -24px rgba(60,10,20,.35);
  font-family:var(--doc);font-size:12pt;line-height:1.725;color:#000}
.page p,.page .p{margin:0;text-align:justify}
.page .anim{animation:fadeup .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q-first{display:grid;grid-template-columns:1.75cm 1fr}
.q-label{font-weight:bold;color:var(--blue)}
.ind{padding-left:1.75cm}
.eq,.fig{padding-left:1.75cm;text-align:center!important}
.sec{font-weight:bold}
.sec span{color:#ff0000;background:#ffff00}
.guide{font-weight:bold;color:var(--navy)}
.ans4{padding-left:1.75cm;display:grid;grid-template-columns:4.25cm 4cm 4cm 1fr;text-align:left!important}
.ans2{padding-left:1.75cm;display:grid;grid-template-columns:8.25cm 1fr;text-align:left!important}
.ans1{padding-left:1.75cm;text-align:left!important}
.al{font-weight:bold;color:var(--blue)}
.lb{font-weight:bold}
.unclear{background:#ffe9a8;outline:1px dashed var(--warn)}
.figbox{display:inline-block;border:1.5px dashed #c9a2aa;color:#8a1c2b;background:#fdf6f7;border-radius:6px;padding:4px 14px;font-family:var(--ui);font-size:10pt;line-height:1.5}
.figok{cursor:pointer;line-height:1!important;padding-top:3pt;padding-bottom:3pt}
.figok:hover svg,.figok:hover img{outline:2px dashed #e7b7bf;outline-offset:3px;border-radius:4px}
.fig[data-key]{cursor:pointer}
.figbox em{display:block;font-style:normal;font-size:8.5pt;color:#b0727e;margin-top:2px}
.figbox.bad{border-color:var(--warn);color:var(--warn);background:#fff8ec}
.figbox:hover{background:#fbeef0;transform:translateY(-1px);transition:.2s}
.page table{border-collapse:collapse;margin-left:1.75cm;line-height:1.15;margin-top:2px}
.page td,.page th{border:.5pt solid #000;padding:2pt 5pt;text-align:center;vertical-align:middle;font-weight:normal}
.page th{background:#fbe4d5;font-weight:bold}
.after-table{margin-top:6pt!important}
svg.vf{overflow:visible}
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.zoom button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:700;color:var(--wine)}
/* Hộp prompt */
.modal{position:fixed;inset:0;background:rgba(40,8,15,.38);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;padding:16px}
.modal[hidden]{display:none}
.card{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:zoomin .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes zoomin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.card header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card header h3{margin:0;font-size:16px;color:var(--wine)}
.card pre{margin:0;padding:16px 18px;overflow:auto;white-space:pre-wrap;font:13px/1.6 ui-monospace,Consolas,monospace;flex:1}
.card footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* Cắt hình */
.card.wide{max-width:1100px;height:86vh;max-height:none}
.crop-for{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cropbody{flex:1;display:grid;grid-template-columns:110px 1fr 260px;min-height:0}
.thumbs{border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.thumbs img{width:100%;border-radius:8px;border:2px solid transparent;cursor:pointer;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.thumbs img.on{border-color:var(--wine)}
.cropstage{position:relative;overflow:auto;background:#f3eef1;display:grid;place-items:start center;padding:14px;min-height:0}
#cropCv{cursor:crosshair;max-width:100%;box-shadow:0 4px 16px rgba(0,0,0,.15);touch-action:none}
.sel{position:absolute;border:2px solid var(--wine);background:rgba(138,28,43,.08);box-shadow:0 0 0 9999px rgba(30,5,10,.25);pointer-events:none;border-radius:2px}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);line-height:1.8;pointer-events:none}
.cropside{border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px;font-size:14px}
.outprev{border:1px dashed var(--line);border-radius:10px;min-height:150px;display:grid;place-items:center;padding:8px;background:#fff;text-align:center;color:var(--muted);font-size:13px}
.outprev img{max-width:100%;max-height:300px}
.cropside .row{display:flex;gap:8px;align-items:center}
.cropside .col{display:flex;flex-direction:column;gap:6px}
#btnImgs b{background:var(--wine);color:#fff;border-radius:999px;padding:0 7px;font-size:12px}
@media (max-width:860px){.cropbody{grid-template-columns:1fr}.thumbs{flex-direction:row;border:0}.thumbs img{width:70px}}
/* Thông báo */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;transition:all .35s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bubble{position:fixed;z-index:25;pointer-events:none;font-family:var(--doc);font-weight:bold;color:var(--wine);animation:float 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes float{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-180px) scale(1.15)}}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){body{overflow:auto}.app{height:auto}.main{grid-template-columns:1fr}textarea{min-height:50vh}.stage{max-height:80vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

"use strict";
/* ================= PROMPT CHO AI ================= */
const PROMPT = `Bạn là người CHÉP LẠI đề Hoá. Đọc ảnh/PDF đề tôi gửi và chép lại TOÀN BỘ nội dung theo khuôn bên dưới, trả về trong MỘT khối code duy nhất. Không giải đề, không trình bày Word, không giải thích, không dùng LaTeX hay Markdown nào khác ngoài các ký hiệu được liệt kê.

GIỮ: tên PHẦN và hướng dẫn làm bài; Câu n (đánh số như đề, mỗi PHẦN có thể đánh lại từ 1); toàn bộ câu hỏi, dữ kiện, số liệu, bảng, các bước thí nghiệm, nhận định a/b/c/d, đáp án A/B/C/D; điểm số tự luận; dữ kiện chung trước Câu 1 (nguyên tử khối...).
BỎ: tên trường, logo, mã đề, SBD, thời gian, năm học, header/footer, số trang, quảng cáo, chữ viết tay, dấu khoanh/tick, nháp.

- Công thức, phương trình, chỉ số, điện tích, mũi tên thường hiện dưới dạng hình/đối tượng nhúng (MathType, iu iu, Equation) chứ không phải chữ. VẪN PHẢI chép đầy đủ từng công thức theo ký hiệu bên dưới, tuyệt đối không bỏ qua hay thay bằng [KHÔNG ĐỌC RÕ].
- Đọc kỹ chỉ số dưới/trên, dấu điện tích, nhãn trên/dưới mũi tên; dùng ngữ cảnh hoá học để đọc cho đúng (ví dụ SO_4^{2-}, H_2SO_4 đặc).
- Chỉ ghi [KHÔNG ĐỌC RÕ] cho đúng ký tự/cụm thật sự không nhìn thấy (bị che, nhoè hẳn, mất góc ảnh). Chữ nhỏ hay hơi mờ vẫn phải đọc. Mỗi [KHÔNG ĐỌC RÕ] chỉ thay một cụm nhỏ, không thay cả câu.
- Với file Word: luôn chép TOÀN BỘ đề theo khuôn, không từ chối, không yêu cầu gửi lại. Công thức nhúng (đối tượng OLE, hình) hãy đọc từ hình hiển thị hoặc dữ liệu đi kèm của nó và chép theo ký hiệu bên dưới. Nếu một công thức nhúng hoàn toàn không truy cập được, đặt [CÔNG THỨC] đúng vị trí đó rồi chép tiếp phần còn lại; không biến cả câu thành [KHÔNG ĐỌC RÕ].

/* ================= LÕI CÔNG THỨC (theo iu iu: row/run/script/arrow) ================= */
const VF = {
  run:(text,role)=>({type:"run",role:role||"chemistry",text}),
  row:(children)=>({type:"row",children}),
  script:(base,sup,sub,variant)=>({type:"script",variant:variant||0,children:[base,sup||VF.row([]),sub||VF.row([])]}),
  arrow:(variant,above,below)=>({type:"arrow",variant,length:2.4,children:[above||VF.row([]),below||VF.row([])]}),
  doc:(root)=>({format:"VietFormula",version:2,font:"Times New Roman",sizePt:12,bold:false,root:root.type==="row"?root:VF.row([root])})
};
const mctx=document.createElement("canvas").getContext("2d");
function textW(s,pt,italic,bold){mctx.font=(italic?"italic ":"")+(bold?"bold ":"")+(pt*96/72)+"px 'Times New Roman',Times,serif";return mctx.measureText(s).width*72/96}
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// layout trả về {w,asc,desc,svg(x,y)} — đơn vị pt, y là baseline
function lay(n,pt){
  if(n.type==="run"){
    const it=n.role==="variable",w=textW(n.text,pt,it);
    const t=n.text||"",tall=/[A-ZĐ0-9bdfhklt()\[\]{}\/|]/.test(t)||t.normalize("NFD").length>t.length,low=/[gjpqyç(),;\[\]{}]/.test(t);
    return {w,asc:pt*.70,desc:pt*.22,ia:t.trim()?pt*(tall?.70:.47):0,id:low?pt*.21:0,svg:(x,y)=>n.text?`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${pt}"${it?' font-style="italic"':""}>${esc(n.text)}</text>`:""};
  }
  if(n.type==="row"){
    const parts=n.children.map(c=>lay(c,pt));let w=0,asc=n.children.length?0:0,desc=0,ia=0,id=0;
    parts.forEach(p=>{w+=p.w;asc=Math.max(asc,p.asc);desc=Math.max(desc,p.desc);ia=Math.max(ia,p.ia||0);id=Math.max(id,p.id||0)});
    return {w,asc,desc,ia,id,svg:(x,y)=>{let s="",cx=x;parts.forEach(p=>{s+=p.svg(cx,y);cx+=p.w});return s}};
  }
  if(n.type==="script"){
    const sp=pt*.70,b=lay(n.children[0],pt),su=lay(n.children[1],sp),sb=lay(n.children[2],sp);
    const up=pt*.40,dn=pt*.22,sw=Math.max(su.w,sb.w)+pt*.03;
    const asc=Math.max(b.asc,su.w?up+su.asc:0),desc=Math.max(b.desc,sb.w?dn+sb.desc:0);
    const ia=Math.max(b.ia||0,su.w?up+(su.ia||0):0),id=Math.max(b.id||0,sb.w?dn+(sb.id||0):0);
    if(n.variant===1){ // chỉ số bên trái, căn phải
      return {w:sw+b.w,asc,desc,ia,id,svg:(x,y)=>su.svg(x+sw-su.w-pt*.03,y-up)+sb.svg(x+sw-sb.w-pt*.03,y+dn)+b.svg(x+sw,y)};
    }
    return {w:b.w+sw,asc,desc,ia,id,svg:(x,y)=>b.svg(x,y)+su.svg(x+b.w+pt*.02,y-up)+sb.svg(x+b.w+pt*.02,y+dn)};
  }
  if(n.type==="arrow"){ // kiểu đã duyệt (giống MathType): thân 0,06 em, đầu khối liền, ngạnh 40°, nhãn 62%, cách thân 0,24 em
    const em=pt,lp=pt*.62,ab=lay(n.children[0],lp),bl=lay(n.children[1],lp),hasUp=ab.w>0,hasDn=bl.w>0;
    const L=Math.max(em*(n.length||2.4),hasUp?ab.w+em*.8:0,hasDn?bl.w+em*.8:0),out=em*.22,W=L+out*2;
    const axis=em*.25,sw=em*.06,ang=40*Math.PI/180,bl_=em*.40,t1=em*.10,t0=em*.05,gap=em*.24;
    const v=n.variant||0,two=v===3||v===4,sep=two?em*.15:0;
    const upH=hasUp?(ab.ia||0)+(ab.id||0)+gap:0,dnH=hasDn?(bl.ia||0)+(bl.id||0)+gap:0;
    const asc=Math.max(em*.62,axis+sep+Math.max(upH,bl_*Math.sin(ang)*.5)),desc=Math.max(em*.2,sep+dnH-axis+em*.02);
    return {w:W,asc,desc,ia:asc,id:desc,svg:(x,y)=>{
      const x1=x+out,x2=x+out+L,ay=y-axis,f=q=>q.toFixed(2),P=pts=>"M"+pts.map(q=>f(q[0])+" "+f(q[1])).join(" L")+"Z";
      const shaft=(a,b,yy)=>`<line x1="${f(a)}" y1="${f(yy)}" x2="${f(b)}" y2="${f(yy)}" stroke="#000" stroke-width="${f(sw)}"/>`;
      const head=(tx,ty,dir,half)=>{const E=side=>{const ex=tx-dir*bl_*Math.cos(ang),ey=ty+side*bl_*Math.sin(ang),ux=(ex-tx)/bl_,uy=(ey-ty)/bl_,nx=-uy*side*dir,ny=ux*side*dir;return {eo:[ex,ey],ei:[ex+nx*t0,ey+ny*t0]}};
        const up=E(-1),dn=E(1),T=[tx,ty],inn=[tx-dir*t1/Math.sin(ang),ty],hs=sw/2;
        if(half===-1)return `<path d="${P([T,up.eo,up.ei,[inn[0],ty+hs],[tx-dir*t1,ty+hs]])}" fill="#000"/>`;
        if(half===1)return `<path d="${P([T,dn.eo,dn.ei,[inn[0],ty-hs],[tx-dir*t1,ty-hs]])}" fill="#000"/>`;
        return `<path d="${P([T,up.eo,up.ei,inn,dn.ei,dn.eo])}" fill="#000"/>`};
      const tip=em*.05;let s="";
      if(v===0)s+=shaft(x1,x2-tip,ay)+head(x2,ay,1);
      else if(v===1)s+=shaft(x1+tip,x2,ay)+head(x1,ay,-1);
      else if(v===2)s+=shaft(x1+tip,x2-tip,ay)+head(x2,ay,1)+head(x1,ay,-1);
      else if(v===3)s+=shaft(x1,x2-tip,ay-sep)+head(x2,ay-sep,1,-1)+shaft(x1+tip,x2,ay+sep)+head(x1,ay+sep,-1,1);
      else s+=shaft(x1,x2-tip,ay-sep)+head(x2,ay-sep,1)+shaft(x1+tip,x2,ay+sep)+head(x1,ay+sep,-1);
      if(hasUp)s+=ab.svg(x+(W-ab.w)/2,ay-sep-gap-(ab.id||0));
      if(hasDn)s+=bl.svg(x+(W-bl.w)/2,ay+sep+gap+(bl.ia||0));
      return s}};
  }
  return {w:0,asc:0,desc:0,svg:()=>""};
}
function vfSVG(doc){
  const pt=doc.sizePt,L=lay(doc.root,pt),pad=.6,W=L.w+pad*2,H=L.asc+L.desc+pad*2;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" class="vf" width="${W.toFixed(2)}pt" height="${H.toFixed(2)}pt" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" font-family="Times New Roman, Times, serif" fill="#000">${L.svg(pad,pad+L.asc)}</svg>`;
  return {svg,W,H,descent:L.desc+pad};
}

/* ================= CÔNG THỨC CẤU TẠO (OpenChemLib) ================= */
const ctCache={};
function ctSVG(smiles){
  smiles=smiles.trim();if(ctCache[smiles]!==undefined)return ctCache[smiles];
  let r=null;
  try{if(typeof OCL!=="undefined"){const m=OCL.Molecule.fromSmiles(smiles);m.inventCoordinates();
    const n=m.getAllAtoms();if(!n)throw new Error("rỗng");
    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(let i=0;i<n;i++){const x=m.getAtomX(i),y=m.getAtomY(i);x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
    const bl=m.getAverageBondLength()||1,BL=24; // độ dài liên kết cố định ≈ 0,64 cm, mọi hình cùng tỉ lệ
    const bw=Math.round((x1-x0)/bl*BL+90),bh=Math.round((y1-y0)/bl*BL+60);
    let svg=m.toSVG(bw,bh,"ct"+Math.random().toString(36).slice(2,8),{autoCrop:true,autoCropMargin:5,suppressChiralText:true,noStereoProblem:true,suppressCIPParity:true,suppressESR:true,noColorOnESRAndCIP:true});
    svg=svg.replace(/<style>[\s\S]*?<\/style>/,"<style>text{font-family:'Times New Roman',Times,serif}line{stroke-linecap:round}polygon{stroke-linejoin:round}</style>")
      .replace(/<[a-z]+[^>]*class="event"[^>]*\/>/g,"")
      .replace(/(fill|stroke)="rgb\([^)]*\)"/g,'$1="#000"')
      .replace(/stroke-width="([\d.]+)"/g,(m0,v)=>`stroke-width="${(+v*.62).toFixed(2)}"`);
    const w=+svg.match(/width="([\d.]+)px"/)[1],h=+svg.match(/height="([\d.]+)px"/)[1];
    let W=w*.75,H=h*.75;const k=Math.min(1,470/W);W*=k;H*=k;
    svg=svg.replace(/width="[\d.]+px" height="[\d.]+px"/,`width="${W.toFixed(1)}pt" height="${H.toFixed(1)}pt"`);
    r={svg,W,H}}}catch(e){r=null}
  ctCache[smiles]=r;return r;
}

/* ================= ĐỒ THỊ & PHỔ ================= */
const numVN=t=>parseFloat(String(t).trim().replace(/[−–]/g,"-").replace(/\s/g,"").replace(",","."));
const fmtVN=v=>{const r=Math.abs(v)<1e-9?0:+v.toPrecision(6);return String(r).replace(".",",")};
function niceTicks(a,b,n){const span=b-a||1,raw=span/(n||5),mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const st=(f<1.5?1:f<3?2:f<7?5:10)*mag;const out=[];for(let v=Math.ceil(a/st-1e-9)*st;v<=b+1e-9;v+=st)out.push(+v.toFixed(10));return {ticks:out,step:st}}
function richSVG(str,x,y,pt,anchor,extra=""){ // chữ có chỉ số trong SVG
  const pcs=inline(str,true).filter(p=>p.k==="t");let w=0;pcs.forEach(p=>w+=textW(p.s,p.va?pt*.7:pt,p.i,p.b));
  let sx=anchor==="middle"?x-w/2:anchor==="end"?x-w:x,o="",cur=0;
  for(const p of pcs){const sh=p.va==="sub"?pt*.25:p.va==="sup"?-pt*.38:0,dy=sh-cur;cur=sh;
    o+=`<tspan${dy?` dy="${dy.toFixed(2)}"`:""} font-size="${(p.va?pt*.7:pt).toFixed(2)}"${p.i?' font-style="italic"':""}${p.b?' font-weight="bold"':""}>${esc(p.s)}</tspan>`}
  return `<text x="${sx.toFixed(2)}" y="${y.toFixed(2)}" ${extra}>${o}</text>`}
function plotSVG(spec){
  const W=spec.W||300,H=spec.H||190,ml=48,mr=14,mt=spec.mt||14,mb=40,pw=W-ml-mr,ph=H-mt-mb,fs=9.5,ts=10.5;
  const all=spec.series.flatMap(s=>s.pts);if(!all.length)return null;
  let xmin=spec.xmin??Math.min(...all.map(p=>p[0])),xmax=spec.xmax??Math.max(...all.map(p=>p[0]));
  let ymin=spec.ymin??Math.min(0,...all.map(p=>p[1])),ymax=spec.ymax??Math.max(...all.map(p=>p[1]));
  if(xmin===xmax){xmin-=1;xmax+=1}if(ymin===ymax){ymax+=1}
  const xt=niceTicks(xmin,xmax,6),yt=niceTicks(ymin,ymax,5);
  if(spec.xmin===undefined){xmin=Math.min(xmin,xt.ticks[0]);xmax=Math.max(xmax,xt.ticks[xt.ticks.length-1])}
  if(spec.ymax===undefined){ymax=yt.ticks[yt.ticks.length-1]<ymax?ymax+yt.step:yt.ticks[yt.ticks.length-1];if(spec.headroom)ymax+=yt.step}
  const yT=niceTicks(ymin,ymax,5).ticks;
  const X=v=>ml+(spec.xrev?(xmax-v):(v-xmin))/(xmax-xmin)*pw,Y=v=>mt+ph-(v-ymin)/(ymax-ymin)*ph;
  let o=`<g stroke="#000" stroke-width="0.8" fill="none"><line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}"/>`;
  const xs=niceTicks(Math.min(xmin,xmax),Math.max(xmin,xmax),6).ticks;
  xs.forEach(v=>o+=`<line x1="${X(v).toFixed(2)}" y1="${mt+ph}" x2="${X(v).toFixed(2)}" y2="${mt+ph+3}"/>`);
  yT.forEach(v=>o+=`<line x1="${ml-3}" y1="${Y(v).toFixed(2)}" x2="${ml}" y2="${Y(v).toFixed(2)}"/>`);o+="</g>";
  o+=`<g fill="#000">`;xs.forEach(v=>o+=richSVG(fmtVN(v),X(v),mt+ph+3+fs,fs,"middle"));yT.forEach(v=>o+=richSVG(fmtVN(v),ml-5,Y(v)+fs*.33,fs,"end"));
  o+=richSVG(spec.xl||"",ml+pw/2,H-6,ts,"middle");

function smoothPath(P){if(P.length<3)return "M"+P.map(p=>p.join(" ")).join(" L");let d=`M${P[0][0].toFixed(2)} ${P[0][1].toFixed(2)}`;

/* ================= ĐỌC KÝ HIỆU TRONG DÒNG ================= */
// Trả về danh sách mẩu: {k:"t",s,b,i,va} | {k:"f",doc}
function grp(s,i){ // đọc nhóm sau _ hoặc ^ : {..} hoặc 1 ký tự (kèm dấu +/- cho ^)
  if(s[i]==="{"){let d=0;for(let j=i;j<s.length;j++){if(s[j]==="{")d++;else if(s[j]==="}"&&--d===0)return [s.slice(i+1,j),j+1]}return [s.slice(i+1),s.length]}
  let m=s.slice(i).match(/^(\d+[+\-–]?|[+\-–]|o|[A-Za-z0-9])/);return m?[m[1],i+m[1].length]:["",i];

const isChemWord=w=>/[A-Z]/.test(w)&&/^[A-Za-z0-9()\[\]·.]+$/.test(w);
function textToVF(str){ // dùng cho nhãn mũi tên: chuyển thành nút công thức
  const out=[];const pieces=inline(str,true);
  for(const p of pieces){
    if(p.k==="f"){out.push(...p.doc.root.children);continue}
    if(p.va){const last=out.pop()||VF.run("");out.push(p.va==="sub"?VF.script(last,null,VF.run(p.s,"text")):VF.script(last,VF.run(p.s,"text"),null));continue}
    // tách từng ký tự cuối thành nút riêng để chỉ số bám đúng
    const parts=p.s.split(/(\s+)/);
    for(const w of parts){if(!w)continue;
      if(isChemWord(w)){const m=w.match(/^(.*?)([A-Z][a-z]?|[)\]]|[a-z])$/);if(m&&m[1])out.push(VF.run(m[1],"chemistry"));out.push(VF.run(m?m[2]:w,"chemistry"))}
      else out.push(VF.run(w,"text"))}
  }
  return VF.row(out);
}
const ARROWS=[ // [regex, variant]
  [/^<=\[([^\]]*)\]=>/,3],[/^-\[([^\]]*)\]->/,0],[/^<-\[([^\]]*)\]-/,1],
  [/^<=>/,3],[/^<-->/,2],[/^-->/,0],[/^<--/,1],[/^→/,0],[/^⇌/,3]
];
function inline(s,inArrow){
  const out=[];let buf="",bold=false,ital=false;
  const flush=()=>{if(buf){out.push({k:"t",s:buf,b:bold,i:ital});buf=""}};
  let i=0;
  while(i<s.length){
    const rest=s.slice(i);
    if(rest.startsWith("**")){flush();bold=!bold;i+=2;continue}
    if(s[i]==="*"&&!inArrow){flush();ital=!ital;i++;continue}
    if(rest.startsWith("[KHÔNG ĐỌC RÕ]")){flush();out.push({k:"t",s:"[KHÔNG ĐỌC RÕ]",b:bold,i:ital,unclear:true});i+=14;continue}
    if(!inArrow){let hit=null;for(const [re,v] of ARROWS){const m=rest.match(re);if(m){hit=[m,v];break}}
      if(hit){flush();const [m,v]=hit;let up="",dn="";if(m[1]!==undefined){const k=m[1].split("|");up=k[0]||"";dn=k[1]||""}
        out.push({k:"f",doc:VF.doc(VF.arrow(v,up.trim()?textToVF(up.trim()):null,dn.trim()?textToVF(dn.trim()):null))});i+=m[0].length;continue}}
    if((s[i]==="_"||s[i]==="^")&&i+1<s.length){
      const a=s[i];let [g1,j]=grp(s,i+1);
      const b2=s[j]===(a==="_"?"^":"_")?s[j]:null;let g2="",k=j;
      if(b2){[g2,k]=grp(s,j+1)}
      g1=g1.replace(/-/g,"–").replace(/–/g,"−");g2=g2.replace(/-/g,"–").replace(/–/g,"−");
      const sub=a==="_"?g1:g2,sup=a==="^"?g1:g2;
      const nested=/[_^]/.test(g1+g2);
      if((b2||nested)&&!inArrow){ // chỉ số xếp chồng → công thức iu iu
        // bên trái (hạt nhân) nếu ngay sau là chữ cái và trước là khoảng trắng/đầu
        const before=buf.match(/[A-Za-z)\]]$/);
        if(!before){const m=s.slice(k).match(/^([A-Z][a-z]?)/);
          if(m){flush();out.push({k:"f",doc:VF.doc(VF.script(VF.run(m[1]),VF.run(sup),VF.run(sub),1))});i=k+m[1].length;continue}}
        // lấy cả cụm hoá học phía trước làm một công thức

        while(out.length&&!buf){const p=out[out.length-1];if(p.k==="t"&&p.va==="sub"&&out.length>1&&out[out.length-2].k==="t"&&!out[out.length-2].va&&/[A-Za-z)\]]$/.test(out[out.length-2].s)){
            const pb=out[out.length-2];const w2=pb.s.match(/[A-Za-z0-9()\[\]·]*$/)[0];const ld=w2.match(/^\d*/)[0];const core=w2.slice(ld.length);
            if(!core)break;out.pop();out.pop();const remain=pb.s.slice(0,pb.s.length-core.length);if(remain)out.push({...pb,s:remain});
            const mb=core.match(/^(.*?)([A-Z][a-z]?|[)\]])$/);if(mb&&mb[1])nodes.unshift(VF.run(mb[1]));nodes.splice(mb&&mb[1]?1:0,0,VF.script(VF.run(mb?mb[2]:core),null,VF.run(p.s,"text")));
            if(remain&&!/[A-Za-z0-9()\[\]·]$/.test(remain))break;else break}else break}
        const mb=word.match(/^(.*?)([A-Z][a-z]?|[)\]])$/);
        const pre=mb?mb[1]:"",base=mb?mb[2]:word;
        if(pre)nodes.push(VF.run(pre));
        nodes.push(VF.script(VF.run(base),sup?textToVF(sup):null,sub?textToVF(sub):null));
        out.push({k:"f",doc:VF.doc(VF.row(nodes))});i=k;continue;
      }
      flush();out.push({k:"t",s:g1.replace(/^o$/,"o"),b:bold,i:false,va:a==="_"?"sub":"sup"});i=j;continue;
    }
    buf+=s[i];i++;
  }
  flush();return out;
}

/* ================= ĐỌC CẤU TRÚC ĐỀ ================= */
function parse(src){
  const figSeen={};
  const lines=src.replace(/\r/g,"").split("\n");const blocks=[];let inQ=false,essay=false,table=null,afterTable=false;
  const push=b=>{if(afterTable){b.after=true;afterTable=false}blocks.push(b)};
  for(let raw of lines){
    const line=raw.trim();
    if(line.startsWith("|")){if(/^\|[\s:\-|]+\|$/.test(line))continue;const cells=line.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(!table){table={type:"table",rows:[]};blocks.push(table)}table.rows.push(cells);continue}
    if(table){table=null;afterTable=true}
    if(!line||line==="---")continue;
    let m;
    if(m=line.match(/^PHẦN\s+[IVX\d]+\b.*$/i)){inQ=false;push({type:"sec",text:line});continue}
    if(m=line.match(/^HD:\s*(.*)$/)){push({type:"guide",text:m[1]});continue}
    if(m=line.match(/^Câu\s+(\d+)\s*(\([^)]*điểm\))?\s*[:.]\s*(\([^)]*điểm\))?\s*(.*)$/)){
      inQ=true;essay=!!(m[2]||m[3]);push({type:"q",n:m[1],pts:m[2]||m[3]||"",text:m[4]});continue}
    if(inQ&&(m=line.match(/^A[.)]\s+(.*)$/))){
      const parts=("A. "+m[1]).split(/\s+(?=[B-D][.)]\s)/);const ans=parts.map(p=>p.replace(/^[A-D][.)]\s*/,""));
      push({type:"ans",items:ans});continue}
    if(inQ&&(m=line.match(/^([B-D])[.)]\s+(.*)$/))){const last=blocks[blocks.length-1];if(last&&last.type==="ans"){last.items.push(m[2]);continue}}
    if(m=line.match(/^PT:\s*(.*)$/)){push({type:"eq",text:m[1]});continue}
    if(m=line.match(/^\[(HÌNH-CT|HÌNH|ĐỒ THỊ|PHỔ MS|PHỔ IR)\s*:?\s*(.*)\]$/i)){const K={"HÌNH-CT":"ct","HÌNH":"hinh","ĐỒ THỊ":"plot","PHỔ MS":"ms","PHỔ IR":"ir"}[m[1].toUpperCase()];
      const base=K+":"+m[2].trim();figSeen[base]=(figSeen[base]||0)+1;push({type:"fig",kind:K,ct:K==="ct",text:m[2].trim(),key:base+"#"+figSeen[base]});continue}
    if(inQ&&(m=line.match(/^([a-e]\))\s+(.*)$/))){push({type:"lab",label:m[1],text:m[2]});continue}
    if(inQ&&(m=line.match(/^((?:Bước|Tác động)\s+\d+\s*[:.])\s*(.*)$/))){push({type:"lab",label:m[1],text:m[2]});continue}
    if(inQ&&(m=line.match(/^(\d+(?:\.\d+)*\.)\s+(.*)$/))){push({type:"lab",label:m[1],text:m[2]});continue}
    push({type:inQ?"child":"body",text:line});
  }
  return blocks;
}

/* ================= ĐO ĐỘ RỘNG ĐÁP ÁN ================= */
const CM=pt=>pt/72*2.54;
function piecesW(pcs){let w=0;for(const p of pcs){if(p.k==="f"){w+=vfSVG(p.doc).W}else w+=textW(p.s,p.va?8:12,p.i,p.b)}return w}
function ansLayout(items){
  const ws=items.map(t=>CM(textW("A. ",12,false,true)+piecesW(inline(t))));
  if(items.length!==4)return 1;
  if(ws[0]<=4.0&&ws[1]<=3.75&&ws[2]<=3.75&&ws[3]<=4.4)return 4;
  if(ws[0]<=7.95&&ws[2]<=7.95&&ws[1]<=8.4&&ws[3]<=8.4)return 2;
  return 1;
}

/* ================= XEM TRƯỚC ================= */
function htmlPieces(pcs){return pcs.map(p=>{
  if(p.k==="f"){const r=vfSVG(p.doc);return r.svg.replace("<svg ",`<svg style="vertical-align:-${r.descent.toFixed(2)}pt" `)}
  let t=esc(p.s);if(p.va)t=`<${p.va}>${t}</${p.va}>`;if(p.b)t=`<b>${t}</b>`;if(p.i)t=`<i>${t}</i>`;if(p.unclear)t=`<span class="unclear">${t}</span>`;return t}).join("")}

let qCount=0,fCount=0,figCount=0,unclear=0,figBad=0;const figStore={};

      case"child":html+=`<p class="ind anim${ac}"${A()}>${H(b.text)}</p>`;break;

        else if(L===2)html+=`<div class="ans2 anim${ac}"${A()}>${cell(b.items[0],0)}${cell(b.items[1],1)}</div><div class="ans2 anim"${A()}>${cell(b.items[2],2)}${b.items[3]!==undefined?cell(b.items[3],3):""}</div>`;

      case"table":{const cols=Math.max(...b.rows.map(r=>r.length)),need=Array(cols).fill(0);b.rows.forEach(r=>r.forEach((c,ci)=>{need[ci]=Math.max(need[ci],Math.max(1.2,CM(piecesW(inline(c)))+0.5))}));const sm=need.reduce((a,x)=>a+x,0);

  chips.innerHTML=`<span class="chip">Câu <b>${qCount}</b></span><span class="chip">Công thức iu iu <b>${fCount}</b></span><span class="chip">Hình <b>${figCount}</b></span>`+(figBad?`<span class="chip warn">Hình chưa dựng được <b>${figBad}</b></span>`:"")+
    (unclear?`<span class="chip warn">Chỗ không đọc rõ <b>${unclear}</b></span>`:"");

  zip.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>${media.map(m=>`<Relationship Id="${m.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("")}${oles.map(m=>`<Relationship Id="${m.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/oleObject" Target="embeddings/${m.name}"/>`).join("")}</Relationships>`);
  zip.file("word/settings.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="720"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`);
  zip.file("word/styles.xml",stylesXML());
  zip.file("word/document.xml",docXML);
  media.forEach(m=>zip.file("word/media/"+m.name,m.blob));oles.forEach(m=>zip.file("word/embeddings/"+m.name,m.data));
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ================= GIAO DIỆN ================= */
const src=document.getElementById("src"),page=document.getElementById("page"),chips=document.getElementById("chips");
const toastEl=document.getElementById("toast");let tt;
function toast(msg){toastEl.innerHTML=msg;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),2800)}
document.querySelectorAll(".btn").forEach(b=>b.addEventListener("pointerdown",e=>{const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");
  d.className="ripple";d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),600)}));
let rt;src.addEventListener("input",()=>{clearTimeout(rt);rt=setTimeout(()=>{render();try{localStorage.setItem("iuiu-draft",src.value)}catch(e){}},220)});
document.getElementById("btnSample").onclick=()=>{src.value=SAMPLE;render();toast("Đã nạp đề mẫu")};
document.getElementById("btnClear").onclick=()=>{src.value="";render();src.focus()};
const modal=document.getElementById("modal");document.getElementById("promptText").textContent=PROMPT;
document.getElementById("btnPrompt").onclick=()=>{modal.hidden=false};
document.getElementById("btnClose").onclick=()=>{modal.hidden=true};
modal.addEventListener("click",e=>{if(e.target===modal)modal.hidden=true});
document.getElementById("btnCopy").onclick=async()=>{try{await navigator.clipboard.writeText(PROMPT);toast("Đã copy prompt. Dán vào chat kèm ảnh đề nhé!");modal.hidden=true}
  catch(e){const r=document.createRange();r.selectNodeContents(document.getElementById("promptText"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Đã bôi đen prompt, bấm Ctrl+C để copy")}};
let zoom=.8;const zw=document.getElementById("zw"),zv=document.getElementById("zVal");
function setZoom(z){zoom=Math.min(1.6,Math.max(.4,z));zw.style.transform=`scale(${zoom})`;zw.style.marginBottom=`${(zoom-1)*29.7}cm`;zv.textContent=Math.round(zoom*100)+"%"}
document.getElementById("zIn").onclick=()=>setZoom(zoom+.1);document.getElementById("zOut").onclick=()=>setZoom(zoom-.1);
const btnEx=document.getElementById("btnExport");
btnEx.onclick=async()=>{
  if(!src.value.trim()){toast("Chưa có nội dung đề để xuất");return}
  if(typeof JSZip==="undefined"){toast("Cần kết nối mạng lần đầu để tải bộ tạo Word");return}
  const old=btnEx.innerHTML;btnEx.innerHTML=`<span class="spin"></span> Đang soạn…`;btnEx.disabled=true;
  try{const blob=await buildDocx();const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    const first=(src.value.match(/PHẦN[^\n]*|Câu[^\n]*/)||["De"])[0];a.download="De_soan_lai_"+new Date().toISOString().slice(0,10)+".docx";
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
    celebrate();toast("✓ Đã tạo file Word – công thức là đối tượng iu iu, bấm đúp để sửa");}
  catch(e){console.error(e);toast("Lỗi khi tạo file: "+esc(e.message))}
  finally{btnEx.innerHTML=old;btnEx.disabled=false}};
function celebrate(){const r=btnEx.getBoundingClientRect();["H₂O","CO₂","O₂","NH₃","SO₄²⁻","C₂H₄","Fe³⁺","H⁺"].forEach((t,k)=>{const b=document.createElement("div");b.className="bubble";b.textContent=t;
  b.style.left=(r.left+r.width/2-14+(Math.random()*40-20))+"px";b.style.top=(r.bottom)+"px";b.style.setProperty("--dx",(Math.random()*240-120)+"px");b.style.fontSize=(14+Math.random()*10)+"px";
  b.style.animationDelay=(k*70)+"ms";b.style.top=(r.top+r.height)+"px";document.body.appendChild(b);setTimeout(()=>b.remove(),2400)})}
/* Nền: vòng benzen trôi nhẹ */
(function(){const c=document.getElementById("bg"),g=c.getContext("2d");let W,Hh,rings=[];const red=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=c.width=innerWidth*devicePixelRatio;Hh=c.height=innerHeight*devicePixelRatio}size();addEventListener("resize",size);
  for(let k=0;k<14;k++)rings.push({x:Math.random(),y:Math.random(),r:18+Math.random()*34,a:Math.random()*6,v:(Math.random()-.5)*.0016,s:.00012+Math.random()*.00025});
  function hex(x,y,r,a){g.beginPath();for(let k=0;k<6;k++){const t=a+k*Math.PI/3;g.lineTo(x+r*Math.cos(t),y+r*Math.sin(t))}g.closePath();g.stroke();g.beginPath();g.arc(x,y,r*.55,0,7);g.stroke()}
  function tick(){g.clearRect(0,0,W,Hh);g.strokeStyle="rgba(138,28,43,.07)";g.lineWidth=1.6*devicePixelRatio;
    rings.forEach(o=>{o.y-=o.s;o.a+=o.v;if(o.y<-.1){o.y=1.1;o.x=Math.random()}hex(o.x*W,o.y*Hh,o.r*devicePixelRatio,o.a)});if(!red)requestAnimationFrame(tick)}tick()})();
/* ================= CẮT & LÀM SẠCH HÌNH ================= */
const srcImgs=[];let curImg=-1,cropKey=null,selR=null,outCanvas=null,ownMode=false;
const cv=document.getElementById("cropCv"),cg=cv.getContext("2d"),selEl=document.getElementById("sel"),cropModal=document.getElementById("cropModal");
function loadFiles(files,cb){[...files].forEach(f=>{if(!f.type.startsWith("image/"))return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>cb(im);im.src=rd.result};rd.readAsDataURL(f)})}
function addSrc(im){srcImgs.push(im);document.getElementById("imgN").textContent=srcImgs.length;if(!cropModal.hidden){drawThumbs();showImg(srcImgs.length-1)}document.getElementById("imgN").parentNode.classList.add("pop");}
document.getElementById("btnImgs").onclick=()=>document.getElementById("fileSrc").click();
document.getElementById("cAdd").onclick=()=>document.getElementById("fileSrc").click();
document.getElementById("fileSrc").onchange=e=>{loadFiles(e.target.files,im=>{addSrc(im);toast("Đã thêm ảnh đề. Bấm vào ô hình trong bản xem trước để cắt")});e.target.value=""};
document.getElementById("cOwn").onclick=()=>document.getElementById("fileOwn").click();
document.getElementById("fileOwn").onchange=e=>{loadFiles(e.target.files,im=>{ownMode=true;document.getElementById("optClean").checked=false;showRaw(im);selR={x:0,y:0,w:im.width,h:im.height};makeOut()});e.target.value=""};
addEventListener("paste",e=>{const its=[...(e.clipboardData||{}).items||[]].filter(i=>i.type.startsWith("image/"));if(!its.length)return;e.preventDefault();loadFiles(its.map(i=>i.getAsFile()),im=>{addSrc(im);toast("Đã dán ảnh đề")})});
function drawThumbs(){const t=document.getElementById("thumbs");t.innerHTML="";srcImgs.forEach((im,i)=>{const x=new Image();x.src=im.src;if(i===curImg)x.className="on";x.onclick=()=>showImg(i);t.appendChild(x)})}
let rawIm=null;
function showRaw(im){rawIm=im;cv.width=im.width;cv.height=im.height;cg.drawImage(im,0,0);document.getElementById("cropEmpty").hidden=true;selEl.hidden=true}
function showImg(i){curImg=i;ownMode=false;showRaw(srcImgs[i]);drawThumbs()}
function openCrop(key,label){cropKey=key;selR=null;outCanvas=null;ownMode=false;document.getElementById("cropFor").textContent=label;
  const st=figStore[key];document.getElementById("wcm").value=st?CM(st.W).toFixed(2):8;document.getElementById("wcmV").textContent=(+document.getElementById("wcm").value).toFixed(2).replace(/\.?0+$/,"").replace(".",",");
  document.getElementById("outImg").src=st&&st.png?st.png:"";document.getElementById("outHint").hidden=!!(st&&st.png);
  cropModal.hidden=false;drawThumbs();if(srcImgs.length){showImg(curImg>=0?curImg:0)}else{cv.width=0;cv.height=0;document.getElementById("cropEmpty").hidden=false}}
page.addEventListener("click",e=>{const el=e.target.closest("[data-key]");if(!el)return;const key=el.dataset.key;openCrop(key,key.replace(/^[a-z]+:/,"").replace(/#\d+$/,""))});
let drag=null;
cv.addEventListener("pointerdown",e=>{if(!rawIm)return;cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),k=cv.width/r.width;drag={x:(e.clientX-r.left)*k,y:(e.clientY-r.top)*k,k}});
cv.addEventListener("pointermove",e=>{if(!drag)return;const r=cv.getBoundingClientRect(),k=drag.k,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;
  selR={x:Math.max(0,Math.min(drag.x,x)),y:Math.max(0,Math.min(drag.y,y)),w:Math.abs(x-drag.x),h:Math.abs(y-drag.y)};placeSel()});
cv.addEventListener("pointerup",()=>{if(!drag)return;drag=null;if(selR&&selR.w>8&&selR.h>8)makeOut()});
function placeSel(){if(!selR)return;const r=cv.getBoundingClientRect(),st=document.getElementById("cropStage").getBoundingClientRect(),k=r.width/cv.width,sc=document.getElementById("cropStage");
  selEl.hidden=false;Object.assign(selEl.style,{left:(r.left-st.left+sc.scrollLeft+selR.x*k)+"px",top:(r.top-st.top+sc.scrollTop+selR.y*k)+"px",width:selR.w*k+"px",height:selR.h*k+"px"})}
function cleanCanvas(c){const w=c.width,h=c.height,g=c.getContext("2d"),id=g.getImageData(0,0,w,h),d=id.data;
  const s=document.createElement("canvas"),sw=Math.max(6,Math.round(w/14)),sh=Math.max(6,Math.round(h/14));s.width=sw;s.height=sh;const sg=s.getContext("2d");
  sg.filter="blur(2px)";sg.drawImage(c,0,0,sw,sh);const b=document.createElement("canvas");b.width=w;b.height=h;const bg=b.getContext("2d");bg.imageSmoothingQuality="high";bg.drawImage(s,0,0,w,h);
  const bd=bg.getImageData(0,0,w,h).data;
  for(let i=0;i<d.length;i+=4){const gy=.299*d[i]+.587*d[i+1]+.114*d[i+2],bv=Math.max(40,.299*bd[i]+.587*bd[i+1]+.114*bd[i+2]);
    let v=(gy/bv-.5)/(.86-.5);v=v<0?0:v>1?1:v;v=Math.pow(v,1.6);const o=Math.round(255*v);d[i]=d[i+1]=d[i+2]=o;d[i+3]=255}
  g.putImageData(id,0,0);return c}
function makeOut(){if(!rawIm||!selR)return;const sx=Math.round(selR.x),sy=Math.round(selR.y),sw=Math.round(selR.w),sh=Math.round(selR.h);
  const up=Math.min(4,Math.max(1,1600/sw));const c=document.createElement("canvas");c.width=Math.round(sw*up);c.height=Math.round(sh*up);
  const g=c.getContext("2d");g.imageSmoothingQuality="high";g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(rawIm,sx,sy,sw,sh,0,0,c.width,c.height);
  if(document.getElementById("optClean").checked)cleanCanvas(c);outCanvas=c;
  document.getElementById("outImg").src=c.toDataURL("image/png");document.getElementById("outHint").hidden=true;
  if(!ownMode){const sugg=Math.min(12,Math.max(4,sw/rawIm.width*14));document.getElementById("wcm").value=sugg;document.getElementById("wcmV").textContent=sugg.toFixed(1).replace(".",",")}}
document.getElementById("optClean").onchange=()=>{if(selR)makeOut()};
document.getElementById("wcm").oninput=e=>document.getElementById("wcmV").textContent=(+e.target.value).toFixed(2).replace(/\.?0+$/,"").replace(".",",");
document.getElementById("cCancel").onclick=()=>{cropModal.hidden=true};
document.getElementById("cDel").onclick=()=>{delete figStore[cropKey];cropModal.hidden=true;render();toast("Đã bỏ hình đã cắt")};
document.getElementById("cSave").onclick=()=>{if(!outCanvas){toast("Hãy kéo chuột khoanh vùng hình trước");return}
  const wcm=+document.getElementById("wcm").value,W=wcm/2.54*72,H=W*outCanvas.height/outCanvas.width,png=outCanvas.toDataURL("image/png");
  outCanvas.toBlob(blob=>{figStore[cropKey]={png,blob,W,H};cropModal.hidden=true;render();toast("✓ Đã chèn hình vào đề")},"image/png")};
cropModal.addEventListener("click",e=>{if(e.target===cropModal)cropModal.hidden=true});
addEventListener("keydown",e=>{if(e.key==="Escape"){cropModal.hidden=true;modal.hidden=true}});

document.getElementById("ver").textContent="Bản "+APP_VER;
let saved=null;try{saved=localStorage.getItem("iuiu-draft")}catch(e){}
src.value=saved&&saved.trim()?saved:SAMPLE;setZoom(innerWidth<900?.5:.8);render();
</script>
