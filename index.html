<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iu iu Soạn đề</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Bố cục: thanh đỏ sẫm trên cùng · trái là ô nội dung · phải là trang A4 xem trước */
:root{
  --wine:#8a1c2b; --wine-deep:#5f0f1c; --wine-soft:#fbeaec;
  --ink:#1d1a1f; --muted:#6c6570; --line:#ece6ea; --paper:#ffffff; --ground:#f7f4f6;
  --blue:#0000ff; --navy:#002060; --gold:#ffd84d; --ok:#1f9d63; --warn:#d97706;
  --ui:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --doc:"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--ground);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr}
/* Thanh trên */
.top{background:linear-gradient(100deg,var(--wine-deep),var(--wine) 55%,#a8283a);color:#fff;
  display:flex;align-items:center;gap:16px;padding:12px max(18px,env(safe-area-inset-left,0px));
  box-shadow:0 6px 24px -12px rgba(95,15,28,.6);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.18) 50%,transparent 70%);
  transform:translateX(-100%);animation:sheen 6s ease-in-out 1s infinite}
@keyframes sheen{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(255,216,77,.85),0 6px 16px -6px rgba(0,0,0,.5);animation:avin .7s cubic-bezier(.2,.9,.3,1.3) both}
.avatar:hover{transform:rotate(-6deg) scale(1.06);transition:transform .25s}
@keyframes avin{from{opacity:0;transform:scale(.4) rotate(-25deg)}}
.logo polygon{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:120;stroke-dashoffset:120;animation:draw 1.4s .2s ease-out forwards}
.logo circle{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1s 1.2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;font-size:12px;opacity:.82;font-weight:500}
.top .spacer{flex:1}
.btn{font-family:var(--ui);font-weight:600;font-size:14px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.24)}
.btn-main{background:#fff;color:var(--wine);box-shadow:0 6px 18px -8px rgba(0,0,0,.45)}
.btn-main:hover{box-shadow:0 10px 26px -8px rgba(0,0,0,.5);transform:translateY(-1px)}
.btn-soft{background:var(--wine-soft);color:var(--wine)}
.btn-soft:hover{background:#f6d9dd}
.ripple{position:absolute;border-radius:50%;transform:scale(0);animation:rip .6s ease-out;background:rgba(138,28,43,.25);pointer-events:none}
.btn-ghost .ripple{background:rgba(255,255,255,.4)}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* Thân */
.main{display:grid;grid-template-columns:minmax(330px,40%) 1fr;gap:18px;padding:18px max(18px,env(safe-area-inset-left,0px));min-height:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;min-width:0;
  box-shadow:0 18px 40px -30px rgba(95,15,28,.35);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.panel:nth-child(2){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--wine)}
.ph .spacer{flex:1}
textarea{flex:1;border:0;resize:none;padding:14px 16px;font:14.5px/1.7 var(--ui);color:var(--ink);outline:none;min-height:0;background:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--ground);color:var(--muted);display:inline-flex;gap:6px;align-items:center;transition:background .3s,color .3s}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.warn{background:#fff4e0;color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.12)}}
/* Xem trước */
.stage{flex:1;overflow:auto;background:repeating-linear-gradient(45deg,#f3eef1 0 12px,#f6f2f4 12px 24px);padding:24px;min-height:0}
.zoomwrap{transform-origin:top center;margin:0 auto;width:21cm}
.page{width:21cm;min-height:29.7cm;background:#fff;margin:0 auto;padding:.75cm 1.5cm 1.5cm 1cm;box-shadow:0 2px 3px rgba(0,0,0,.08),0 24px 50px -24px rgba(60,10,20,.35);
  font-family:var(--doc);font-size:12pt;line-height:1.725;color:#000}
.page p,.page .p{margin:0;text-align:justify}
.page .anim{animation:fadeup .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q-first{display:grid;grid-template-columns:1.75cm 1fr}
.q-label{font-weight:bold;color:var(--blue)}
.ind{padding-left:1.75cm}
.eq,.fig{padding-left:1.75cm;text-align:center!important}
.sec{font-weight:bold}
.sec span{color:#ff0000;background:#ffff00}
.guide{font-weight:bold;color:var(--navy)}
.ans4{padding-left:1.75cm;display:grid;grid-template-columns:4.25cm 4cm 4cm 1fr;text-align:left!important}
.ans2{padding-left:1.75cm;display:grid;grid-template-columns:8.25cm 1fr;text-align:left!important}
.ans1{padding-left:1.75cm;text-align:left!important}
.al{font-weight:bold;color:var(--blue)}
.lb{font-weight:bold}
.unclear{background:#ffe9a8;outline:1px dashed var(--warn)}
.figbox{display:inline-block;border:1.5px dashed #c9a2aa;color:#8a1c2b;background:#fdf6f7;border-radius:6px;padding:4px 14px;font-family:var(--ui);font-size:10pt;line-height:1.5}
.page table{border-collapse:collapse;margin-left:1.75cm;line-height:1.15;margin-top:2px}
.page td,.page th{border:.5pt solid #000;padding:2pt 5pt;text-align:center;vertical-align:middle;font-weight:normal}
.page th{background:#fbe4d5;font-weight:bold}
.after-table{margin-top:6pt!important}
svg.vf{overflow:visible}
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.zoom button{border:1px solid var(--line);background:#fff;border-radius:8px;width:28px;height:28px;cursor:pointer;font-weight:700;color:var(--wine)}
/* Hộp prompt */
.modal{position:fixed;inset:0;background:rgba(40,8,15,.38);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;padding:16px}
.modal[hidden]{display:none}
.card{background:#fff;border-radius:18px;max-width:760px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:zoomin .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes zoomin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.card header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card header h3{margin:0;font-size:16px;color:var(--wine)}
.card pre{margin:0;padding:16px 18px;overflow:auto;white-space:pre-wrap;font:13px/1.6 ui-monospace,Consolas,monospace;flex:1}
.card footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* Thông báo */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;transition:all .35s cubic-bezier(.2,.9,.3,1.2);display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.bubble{position:fixed;z-index:25;pointer-events:none;font-family:var(--doc);font-weight:bold;color:var(--wine);animation:float 1.6s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes float{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),-180px) scale(1.15)}}
.spin{width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:860px){body{overflow:auto}.app{height:auto}.main{grid-template-columns:1fr}textarea{min-height:50vh}.stage{max-height:80vh}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

GIỮ: tên PHẦN và hướng dẫn làm bài; Câu n; toàn bộ câu hỏi, dữ kiện, số liệu, bảng, bước thí nghiệm, nhận định a/b/c/d, đáp án A/B/C/D; điểm số tự luận; dữ kiện chung trước Câu 1 (nguyên tử khối...).

const SAMPLE = `Cho nguyên tử khối: H = 1; C = 12; O = 16; S = 32; Fe = 56.

function lay(n,pt){
  if(n.type==="run"){
    const it=n.role==="variable",w=textW(n.text,pt,it);
    return {w,asc:pt*.70,desc:pt*.22,svg:(x,y)=>n.text?`<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" font-size="${pt}"${it?' font-style="italic"':""}>${esc(n.text)}</text>`:""};
  }
  if(n.type==="row"){
    const parts=n.children.map(c=>lay(c,pt));let w=0,asc=n.children.length?0:0,desc=0;
    parts.forEach(p=>{w+=p.w;asc=Math.max(asc,p.asc);desc=Math.max(desc,p.desc)});
    return {w,asc,desc,svg:(x,y)=>{let s="",cx=x;parts.forEach(p=>{s+=p.svg(cx,y);cx+=p.w});return s}};
  }
  if(n.type==="script"){
    const sp=pt*.70,b=lay(n.children[0],pt),su=lay(n.children[1],sp),sb=lay(n.children[2],sp);
    const up=pt*.40,dn=pt*.22,sw=Math.max(su.w,sb.w)+pt*.03;
    const asc=Math.max(b.asc,su.w?up+su.asc:0),desc=Math.max(b.desc,sb.w?dn+sb.desc:0);
    if(n.variant===1){ // chỉ số bên trái, căn phải
      return {w:sw+b.w,asc,desc,svg:(x,y)=>su.svg(x+sw-su.w-pt*.03,y-up)+sb.svg(x+sw-sb.w-pt*.03,y+dn)+b.svg(x+sw,y)};
    }
    return {w:b.w+sw,asc,desc,svg:(x,y)=>b.svg(x,y)+su.svg(x+b.w+pt*.02,y-up)+sb.svg(x+b.w+pt*.02,y+dn)};
  }
  if(n.type==="arrow"){
    const lp=pt*.75,ab=lay(n.children[0],lp),bl=lay(n.children[1],lp);
    const L=Math.max((n.length||2.4)*pt,Math.max(ab.w,bl.w)+pt*.8),pad=pt*.18,axis=pt*.27,gap=pt*.16;
    const v=n.variant||0,two=v===3||v===4,off=two?pt*.10:0;
    const asc=Math.max(pt*.7,axis+off+gap+(ab.w?ab.asc+ab.desc:0)),desc=Math.max(pt*.22,(bl.w?bl.asc+bl.desc+gap-axis+off:0));
    const W=L+2*pad;
    return {w:W,asc,desc,svg:(x,y)=>{
      const x1=x+pad,x2=x+pad+L,ay=y-axis,hl=pt*.34,hw=pt*.13,sw=(pt*.055).toFixed(3);
      const line=(a,b,yy)=>`<line x1="${a.toFixed(2)}" y1="${yy.toFixed(2)}" x2="${b.toFixed(2)}" y2="${yy.toFixed(2)}" stroke="#000" stroke-width="${sw}"/>`;
      const head=(tx,yy,dir,half)=>{const bx=tx-dir*hl;
        return half?`<path d="M${tx.toFixed(2)} ${yy.toFixed(2)} L${bx.toFixed(2)} ${(yy+half*hw*1.4).toFixed(2)} L${(bx+dir*hl*.25).toFixed(2)} ${yy.toFixed(2)}Z" fill="#000"/>`
        :`<path d="M${tx.toFixed(2)} ${yy.toFixed(2)} L${bx.toFixed(2)} ${(yy-hw).toFixed(2)} L${(bx+dir*hl*.28).toFixed(2)} ${yy.toFixed(2)} L${bx.toFixed(2)} ${(yy+hw).toFixed(2)}Z" fill="#000"/>`};
      let s="";
      if(v===0)s+=line(x1,x2-hl*.6,ay)+head(x2,ay,1);
      else if(v===1)s+=line(x1+hl*.6,x2,ay)+head(x1,ay,-1);
      else if(v===2)s+=line(x1+hl*.6,x2-hl*.6,ay)+head(x2,ay,1)+head(x1,ay,-1);
      else if(v===3)s+=line(x1,x2-hl*.5,ay-off)+head(x2,ay-off,1,-1)+line(x1+hl*.5,x2,ay+off)+head(x1,ay+off,-1,1);
      else s+=line(x1,x2-hl*.6,ay-off)+head(x2,ay-off,1)+line(x1+hl*.6,x2,ay+off)+head(x1,ay+off,-1);
      if(ab.w)s+=ab.svg(x+(W-ab.w)/2,ay-off-gap-ab.desc);
      if(bl.w)s+=bl.svg(x+(W-bl.w)/2,ay+off+gap+bl.asc);
      return s}};
  }
  return {w:0,asc:0,desc:0,svg:()=>""};
}
function vfSVG(doc){
  const pt=doc.sizePt,L=lay(doc.root,pt),pad=.6,W=L.w+pad*2,H=L.asc+L.desc+pad*2;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" class="vf" width="${W.toFixed(2)}pt" height="${H.toFixed(2)}pt" viewBox="0 0 ${W.toFixed(2)} ${H.toFixed(2)}" font-family="Times New Roman, Times, serif" fill="#000">${L.svg(pad,pad+L.asc)}</svg>`;
  return {svg,W,H,descent:L.desc+pad};
}

/* ================= ĐỌC KÝ HIỆU TRONG DÒNG ================= */
// Trả về danh sách mẩu: {k:"t",s,b,i,va} | {k:"f",doc}
function grp(s,i){ // đọc nhóm sau _ hoặc ^ : {..} hoặc 1 ký tự (kèm dấu +/- cho ^)
  if(s[i]==="{"){const j=s.indexOf("}",i);if(j<0)return [s.slice(i+1),s.length];return [s.slice(i+1,j),j+1]}
  let m=s.slice(i).match(/^(\d+[+\-–]?|[+\-–]|o|[A-Za-z0-9])/);return m?[m[1],i+m[1].length]:["",i];
}
const isChemWord=w=>/[A-Z]/.test(w)&&/^[A-Za-z0-9()\[\]·.]+$/.test(w);
function textToVF(str){ // dùng cho nhãn mũi tên: chuyển thành nút công thức
  const out=[];const pieces=inline(str,true);
  for(const p of pieces){
    if(p.k==="f"){out.push(...p.doc.root.children);continue}
    if(p.va){const last=out.pop()||VF.run("");out.push(p.va==="sub"?VF.script(last,null,VF.run(p.s,"text")):VF.script(last,VF.run(p.s,"text"),null));continue}
    // tách từng ký tự cuối thành nút riêng để chỉ số bám đúng
    const parts=p.s.split(/(\s+)/);
    for(const w of parts){if(!w)continue;
      if(isChemWord(w)){const m=w.match(/^(.*?)([A-Z][a-z]?|[)\]]|[a-z])$/);if(m&&m[1])out.push(VF.run(m[1],"chemistry"));out.push(VF.run(m?m[2]:w,"chemistry"))}
      else out.push(VF.run(w,"text"))}
  }
  return VF.row(out);
}
const ARROWS=[ // [regex, variant]
  [/^<=\[([^\]]*)\]=>/,3],[/^-\[([^\]]*)\]->/,0],[/^<-\[([^\]]*)\]-/,1],
  [/^<=>/,3],[/^<-->/,2],[/^-->/,0],[/^<--/,1],[/^→/,0],[/^⇌/,3]
];
function inline(s,inArrow){
  const out=[];let buf="",bold=false,ital=false;
  const flush=()=>{if(buf){out.push({k:"t",s:buf,b:bold,i:ital});buf=""}};
  let i=0;
  while(i<s.length){
    const rest=s.slice(i);
    if(rest.startsWith("**")){flush();bold=!bold;i+=2;continue}
    if(s[i]==="*"&&!inArrow){flush();ital=!ital;i++;continue}
    if(rest.startsWith("[KHÔNG ĐỌC RÕ]")){flush();out.push({k:"t",s:"[KHÔNG ĐỌC RÕ]",b:bold,i:ital,unclear:true});i+=14;continue}
    if(!inArrow){let hit=null;for(const [re,v] of ARROWS){const m=rest.match(re);if(m){hit=[m,v];break}}
      if(hit){flush();const [m,v]=hit;let up="",dn="";if(m[1]!==undefined){const k=m[1].split("|");up=k[0]||"";dn=k[1]||""}
        out.push({k:"f",doc:VF.doc(VF.arrow(v,up.trim()?textToVF(up.trim()):null,dn.trim()?textToVF(dn.trim()):null))});i+=m[0].length;continue}}
    if((s[i]==="_"||s[i]==="^")&&i+1<s.length){
      const a=s[i];let [g1,j]=grp(s,i+1);
      const b2=s[j]===(a==="_"?"^":"_")?s[j]:null;let g2="",k=j;
      if(b2){[g2,k]=grp(s,j+1)}
      g1=g1.replace(/-/g,"–").replace(/–/g,"−");g2=g2.replace(/-/g,"–").replace(/–/g,"−");
      const sub=a==="_"?g1:g2,sup=a==="^"?g1:g2;
      if(b2&&!inArrow){ // chỉ số xếp chồng → công thức iu iu
        // bên trái (hạt nhân) nếu ngay sau là chữ cái và trước là khoảng trắng/đầu
        const before=buf.match(/[A-Za-z)\]]$/);
        if(!before){const m=s.slice(k).match(/^([A-Z][a-z]?)/);
          if(m){flush();out.push({k:"f",doc:VF.doc(VF.script(VF.run(m[1]),VF.run(sup),VF.run(sub),1))});i=k+m[1].length;continue}}
        // lấy cả cụm hoá học phía trước làm một công thức
        let word=buf.match(/[A-Za-z0-9()\[\]·]*$/)[0];const lead=word.match(/^\d*/)[0];word=word.slice(lead.length);
        buf=buf.slice(0,buf.length-word.length);flush();
        const nodes=[];
        // gom các mẩu chỉ số dưới đã ghép trước đó trong cùng cụm
        while(out.length&&!buf){const p=out[out.length-1];if(p.k==="t"&&p.va==="sub"&&out.length>1&&out[out.length-2].k==="t"&&!out[out.length-2].va&&/[A-Za-z)\]]$/.test(out[out.length-2].s)){
            const pb=out[out.length-2];const w2=pb.s.match(/[A-Za-z0-9()\[\]·]*$/)[0];const ld=w2.match(/^\d*/)[0];const core=w2.slice(ld.length);
            if(!core)break;out.pop();out.pop();const remain=pb.s.slice(0,pb.s.length-core.length);if(remain)out.push({...pb,s:remain});
            const mb=core.match(/^(.*?)([A-Z][a-z]?|[)\]])$/);if(mb&&mb[1])nodes.unshift(VF.run(mb[1]));nodes.splice(mb&&mb[1]?1:0,0,VF.script(VF.run(mb?mb[2]:core),null,VF.run(p.s,"text")));
            if(remain&&!/[A-Za-z0-9()\[\]·]$/.test(remain))break;else break}else break}
        const mb=word.match(/^(.*?)([A-Z][a-z]?|[)\]])$/);
        const pre=mb?mb[1]:"",base=mb?mb[2]:word;
        if(pre)nodes.push(VF.run(pre));
        nodes.push(VF.script(VF.run(base),VF.run(sup,"text"),VF.run(sub,"text")));
        out.push({k:"f",doc:VF.doc(VF.row(nodes))});i=k;continue;
      }
      flush();out.push({k:"t",s:g1.replace(/^o$/,"o"),b:bold,i:false,va:a==="_"?"sub":"sup"});i=j;continue;
    }
    buf+=s[i];i++;
  }
  flush();return out;
}

/* ================= ĐỌC CẤU TRÚC ĐỀ ================= */
function parse(src){
  const lines=src.replace(/\r/g,"").split("\n");const blocks=[];let inQ=false,essay=false,table=null,afterTable=false;
  const push=b=>{if(afterTable){b.after=true;afterTable=false}blocks.push(b)};
  for(let raw of lines){
    const line=raw.trim();
    if(line.startsWith("|")){if(/^\|[\s:\-|]+\|$/.test(line))continue;const cells=line.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      if(!table){table={type:"table",rows:[]};blocks.push(table)}table.rows.push(cells);continue}
    if(table){table=null;afterTable=true}
    if(!line||line==="---")continue;
    let m;
    if(m=line.match(/^PHẦN\s+[IVX\d]+\b.*$/i)){inQ=false;push({type:"sec",text:line});continue}
    if(m=line.match(/^HD:\s*(.*)$/)){push({type:"guide",text:m[1]});continue}
    if(m=line.match(/^Câu\s+(\d+)\s*(\([^)]*điểm\))?\s*[:.]\s*(\([^)]*điểm\))?\s*(.*)$/)){
      inQ=true;essay=!!(m[2]||m[3]);push({type:"q",n:m[1],pts:m[2]||m[3]||"",text:m[4]});continue}
    if(inQ&&(m=line.match(/^A[.)]\s+(.*)$/))){
      const parts=("A. "+m[1]).split(/\s+(?=[B-D][.)]\s)/);const ans=parts.map(p=>p.replace(/^[A-D][.)]\s*/,""));
      push({type:"ans",items:ans});continue}
    if(inQ&&(m=line.match(/^([B-D])[.)]\s+(.*)$/))){const last=blocks[blocks.length-1];if(last&&last.type==="ans"){last.items.push(m[2]);continue}}
    if(m=line.match(/^PT:\s*(.*)$/)){push({type:"eq",text:m[1]});continue}
    if(m=line.match(/^\[HÌNH(-CT)?\s*:?\s*([^\]]*)\]$/)){push({type:"fig",ct:!!m[1],text:m[2]});continue}
    if(inQ&&(m=line.match(/^([a-e]\))\s+(.*)$/))){push({type:"lab",label:m[1],text:m[2]});continue}
    if(inQ&&(m=line.match(/^((?:Bước|Tác động)\s+\d+\s*[:.])\s*(.*)$/))){push({type:"lab",label:m[1],text:m[2]});continue}
    if(inQ&&(m=line.match(/^(\d+(?:\.\d+)*\.)\s+(.*)$/))){push({type:"lab",label:m[1],text:m[2]});continue}
    push({type:inQ?"child":"body",text:line});
  }
  return blocks;
}

/* ================= ĐO ĐỘ RỘNG ĐÁP ÁN ================= */
const CM=pt=>pt/72*2.54;
function piecesW(pcs){let w=0;for(const p of pcs){if(p.k==="f"){w+=vfSVG(p.doc).W}else w+=textW(p.s,p.va?8:12,p.i,p.b)}return w}
function ansLayout(items){
  const ws=items.map(t=>CM(textW("A. ",12,false,true)+piecesW(inline(t))));
  if(items.length!==4)return 1;
  if(ws[0]<=4.0&&ws[1]<=3.75&&ws[2]<=3.75&&ws[3]<=4.4)return 4;
  if(ws[0]<=7.95&&ws[2]<=7.95&&ws[1]<=8.4&&ws[3]<=8.4)return 2;
  return 1;
}

/* ================= XEM TRƯỚC ================= */
function htmlPieces(pcs){return pcs.map(p=>{
  if(p.k==="f"){const r=vfSVG(p.doc);return r.svg.replace("<svg ",`<svg style="vertical-align:-${r.descent.toFixed(2)}pt" `)}
  let t=esc(p.s);if(p.va)t=`<${p.va}>${t}</${p.va}>`;if(p.b)t=`<b>${t}</b>`;if(p.i)t=`<i>${t}</i>`;if(p.unclear)t=`<span class="unclear">${t}</span>`;return t}).join("")}
const H=t=>htmlPieces(inline(t));
let qCount=0,fCount=0,figCount=0,unclear=0;
function render(){
  const blocks=parse(src.value);let html="";qCount=0;fCount=0;figCount=0;unclear=(src.value.match(/\[KHÔNG ĐỌC RÕ\]/g)||[]).length;
  src.value.replace(/<=\[|-\[|<=>|<-->|-->|<--|[A-Za-z)\]][_^]\S*?[_^]/g,()=>{fCount++});
  let d=0;const A=()=>` style="animation-delay:${Math.min(d++*25,600)}ms"`;
  for(const b of blocks){
    const ac=b.after?" after-table":"";
    switch(b.type){
      case"sec":html+=`<p class="sec anim${ac}"${A()}><span>${esc(b.text)}</span></p>`;break;
      case"guide":html+=`<p class="guide anim${ac}"${A()}>${H(b.text)}</p>`;break;
      case"body":html+=`<p class="anim${ac}"${A()}>${H(b.text)}</p>`;break;
      case"q":qCount++;html+=`<div class="q-first anim${ac}"${A()}><span class="q-label">Câu ${b.n}:</span><p>${b.pts?`<b>${esc(b.pts)}</b> `:""}${H(b.text)}</p></div>`;break;
      case"child":html+=`<p class="ind anim${ac}"${A()}>${H(b.text)}</p>`;break;
      case"lab":html+=`<p class="ind anim${ac}"${A()}><span class="lb">${esc(b.label)}</span> ${H(b.text)}</p>`;break;
      case"eq":html+=`<p class="eq anim${ac}"${A()}>${H(b.text)}</p>`;break;
      case"fig":figCount++;html+=`<p class="fig anim${ac}"${A()}><span class="figbox">${b.ct?"Công thức cấu tạo":"Hình"}: ${H(b.text)}</span></p>`;break;
      case"ans":{const L=ansLayout(b.items),c="ABCD";const cell=(t,k)=>`<span><span class="al">${c[k]}.</span> ${H(t)}</span>`;
        if(L===4)html+=`<div class="ans4 anim${ac}"${A()}>${b.items.map(cell).join("")}</div>`;
        else if(L===2)html+=`<div class="ans2 anim${ac}"${A()}>${cell(b.items[0],0)}${cell(b.items[1],1)}</div><div class="ans2 anim"${A()}>${cell(b.items[2],2)}${b.items[3]!==undefined?cell(b.items[3],3):""}</div>`;
        else html+=b.items.map((t,k)=>`<p class="ans1 anim"${A()}>${cell(t,k)}</p>`).join("");break}
      case"table":{html+=`<table class="anim"${A()}>`+b.rows.map((r,ri)=>"<tr>"+r.map(c=>ri?`<td>${H(c)}</td>`:`<th>${H(c)}</th>`).join("")+"</tr>").join("")+"</table>";break}
    }
  }
  page.innerHTML=html||`<p style="color:#9b8f97;font-family:var(--ui);text-align:center;margin-top:3cm">Dán nội dung đề vào ô bên trái, bản xem trước hiện ở đây.</p>`;
  chips.innerHTML=`<span class="chip">Câu <b>${qCount}</b></span><span class="chip">Công thức iu iu <b>${fCount}</b></span><span class="chip">Hình <b>${figCount}</b></span>`+
    (unclear?`<span class="chip warn">Chỗ không đọc rõ <b>${unclear}</b></span>`:"");
}

async function svgToPng(svg,W,H,scale){
  return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=Math.ceil(W*scale);c.height=Math.ceil(H*scale);
    const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png")};
    img.onerror=()=>rej(new Error("svg"));img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)})}
async function buildDocx(){
  const blocks=parse(src.value);const media=[];let rid=10,pid=1;

    const n=pid++;const json=xe(JSON.stringify(doc));
    return `<w:r><w:rPr><w:position w:val="-${pos}"/></w:rPr><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${n}" name="VF${n}" descr="${json}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="${name}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`}
  async function runs(text,extra=""){let o="";for(const p of inline(text)){o+=p.k==="f"?await runF(p.doc):runT(p,extra)}return o}
  const P=(style,body,ppr="",after=false)=>`<w:p><w:pPr><w:pStyle w:val="${style}"/>${after?`<w:spacing w:before="120"/>`:""}${ppr}</w:pPr>${body}</w:p>`;
  const lab=(t,color)=>`<w:r><w:rPr><w:b/>${color?`<w:color w:val="${color}"/>`:""}</w:rPr><w:t xml:space="preserve">${xe(t)}</w:t></w:r>`;
  const TAB="<w:r><w:tab/></w:r>";
  let body="";let essay=false;
  for(const b of blocks){
    const af=!!b.after;
    switch(b.type){
      case"sec":body+=P("SECTION_TITLE",`<w:r><w:rPr><w:b/><w:color w:val="FF0000"/><w:highlight w:val="yellow"/></w:rPr><w:t xml:space="preserve">${xe(b.text)}</w:t></w:r>`,"",af);break;
      case"guide":body+=P("SECTION_GUIDE",await runs(b.text),"",af);break;
      case"body":body+=P("BODY",await runs(b.text),"",af);break;
      case"q":essay=!!b.pts;body+=P(essay?"ESSAY_MAIN":"QUESTION_FIRST",lab(`Câu ${b.n}:`,"0000FF")+TAB+(b.pts?lab(b.pts)+(b.text?`<w:r><w:t xml:space="preserve"> </w:t></w:r>`:""):"")+await runs(b.text),"",af);break;
      case"child":body+=P(essay?"ESSAY_CHILD":"QUESTION_CHILD",await runs(b.text),"",af);break;
      case"lab":{const st=/^(Bước|Tác)/.test(b.label)?"ESSAY_STEP":/^\d/.test(b.label)?"ESSAY_ITEM":essay?"ESSAY_REQUEST":"QUESTION_CHILD";
        body+=P(st,lab(b.label+" ")+await runs(b.text),"",af);break}
      case"eq":body+=P("EQUATION_LINE",await runs(b.text),"",af);break;
      case"fig":body+=P("FIGURE_CODE",`<w:r><w:rPr><w:highlight w:val="cyan"/></w:rPr><w:t xml:space="preserve">[CHÈN HÌNH THỦ CÔNG – ${xe(b.ct?"Công thức cấu tạo: ":"")}${xe(b.text.replace(/[_^{}]/g,""))}]</w:t></w:r>`,"",af);break;
      case"ans":{const L=ansLayout(b.items),c="ABCD";const one=async k=>lab(c[k]+". ","0000FF")+await runs(b.items[k]);

        else for(let k=0;k<b.items.length;k++)body+=P("ANSWER_1",await one(k),"",af&&k===0);break}
      case"table":{const cols=Math.max(...b.rows.map(r=>r.length));const need=Array(cols).fill(0);
        b.rows.forEach((r,ri)=>r.forEach((c,ci)=>{need[ci]=Math.max(need[ci],CM(piecesW(inline(c))*(ri?1:1.08))+0.5)}));
        const total=Math.min(16.75,need.reduce((a,x)=>a+Math.max(x,1.2),0));const sum=need.reduce((a,x)=>a+Math.max(x,1.2),0);
        const widths=need.map(x=>TW(Math.max(x,1.2)*total/sum));
        const bd=`<w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join("")}</w:tblBorders>`;
        let t=`<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,x)=>a+x,0)}" w:type="dxa"/><w:tblInd w:w="${TW(1.75)}" w:type="dxa"/>${bd}<w:tblLayout w:type="fixed"/><w:tblLook w:val="04A0" w:firstRow="1" w:lastRow="0" w:firstColumn="1" w:lastColumn="0" w:noHBand="0" w:noVBand="1"/></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("")}</w:tblGrid>`;
        for(let ri=0;ri<b.rows.length;ri++){t+="<w:tr>";for(let ci=0;ci<cols;ci++){const c=b.rows[ri][ci]||"";
          t+=`<w:tc><w:tcPr><w:tcW w:w="${widths[ci]}" w:type="dxa"/>${ri?"":`<w:shd w:val="clear" w:color="auto" w:fill="FBE4D5"/>`}<w:vAlign w:val="center"/></w:tcPr>${P(ri?"TABLE_CELL":"TABLE_HEADER",await runs(c,ri?"":"<w:b/>"))}</w:tc>`}t+="</w:tr>"}
        body+=t+"</w:tbl>";break}
    }
  }
  if(body.endsWith("</w:tbl>"))body+=P("BODY","","",true);
  const sect=`<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="${TW(.75)}" w:right="${TW(1.5)}" w:bottom="${TW(1.5)}" w:left="${TW(1)}" w:header="0" w:footer="0" w:gutter="0"/><w:cols w:space="720"/></w:sectPr>`;
  const docXML=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body}${sect}</w:body></w:document>`;
  const zip=new JSZip();
  zip.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/></Types>`);
  zip.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/_rels/document.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/>${media.map(m=>`<Relationship Id="${m.id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name}"/>`).join("")}</Relationships>`);
